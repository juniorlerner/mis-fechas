apply plugin: 'com.android.application'

android {
    namespace 'com.cesia.misfechas'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cesia.misfechas'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
